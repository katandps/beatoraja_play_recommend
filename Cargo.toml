[workspace]
members = [
    "crates/model",
    "crates/table",
    "crates/sqlite",
    "crates/schema",
    "crates/mysql",
    "crates/server",
    "crates/oauth_google",
    "crates/repository",
    "crates/service",
    "crates/session",
]
resolver = "2"

[workspace.dependencies]
reqwest = { version = "0.13.5", features = ["json"] }

[profile.release]
debug = 1
